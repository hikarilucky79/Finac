name: Go conformance tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-prefix:
    name: commit prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require bracketed commit prefix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            COMMITS="$(git rev-list "$HEAD_SHA")"
          else
            COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          fi
          for commit in $COMMITS; do
            subject="$(git log -1 --format=%s "$commit")"
            if [[ ! "$subject" =~ ^\[(test|docs|ci|fix|feat|refactor|chore)\][[:space:]].+ ]]; then
              echo "Invalid commit subject: $subject"
              echo "Use [test], [docs], [ci], [fix], [feat], [refactor], or [chore]."
              exit 1
            fi
          done

  conformance:
    name: conformance / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [development, preview, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run ${{ matrix.suite }} contract tests
        run: go test -count=1 -v ./tests/${{ matrix.suite }}/...
